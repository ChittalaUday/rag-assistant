# Default generic ontology: what kinds of things exist and which typed relations may connect them.
# Domain-neutral on purpose. Replace with your own file via KE_ONTOLOGY_PATH (same structure).
#
# class       entities of the same class with the same name are the same entity ("Atlas" the product
#             and "Atlas" the project merge; a person and a product named Atlas do not)
# standalone  keep the entity even when no relation mentions it (named things); abstract things
#             such as concepts or processes are only kept when they take part in a relation
# domain/range  allowed subject/object types for a relation; omitted = any type

[types.Person]
description = "a named individual"
class = "person"
standalone = true
aliases = ["individual", "human", "employee name"]

[types.Organization]
description = "a company, institution, team, department, committee, agency or government body"
class = "organization"
standalone = true
aliases = ["company", "org", "institution", "team", "department", "group", "agency", "vendor", "customer", "partner", "business"]

[types.Role]
description = "a job title or position, e.g. 'VP Engineering', 'Reporting Manager'"
class = "role"
standalone = false
aliases = ["title", "position", "designation", "job_title", "job title"]

[types.Location]
description = "a country, city, address, region or facility"
class = "place"
standalone = true
aliases = ["place", "city", "country", "region", "address", "geography"]

[types.Product]
description = "a named product, service, software system, tool, platform or technology"
class = "thing"
standalone = true
aliases = ["service", "software", "system", "tool", "platform", "technology", "application", "app", "device", "api", "database"]

[types.Project]
description = "a named project, programme, initiative or workstream"
class = "thing"
standalone = true
aliases = ["program", "programme", "initiative", "workstream"]

[types.Process]
description = "a procedure, workflow, activity, cycle or practice"
class = "abstract"
standalone = false
aliases = ["procedure", "workflow", "activity", "practice", "step", "cycle"]

[types.Policy]
description = "a rule, policy, guideline, standard, requirement, control or agreement"
class = "abstract"
standalone = false
aliases = ["rule", "guideline", "standard", "requirement", "agreement", "control", "regulation", "law"]

[types.Event]
description = "a named event, meeting, period, milestone, release or deadline"
class = "event"
standalone = true
aliases = ["meeting", "milestone", "release", "period", "deadline", "funding round", "incident"]

[types.Document]
description = "a named document, form, report, certificate, manual or specification"
class = "document"
standalone = false
aliases = ["form", "report", "certificate", "specification", "manual", "record", "file", "ticket", "page"]

[types.Concept]
description = "a defined term, topic, metric, category or quantity worth tracking"
class = "abstract"
standalone = false
aliases = ["term", "topic", "metric", "category", "attribute", "quantity", "field", "parameter", "entity", "other", "literal"]

# ---- relations: subject --predicate--> object, read as a sentence ---------------------------------

[predicates.part_of]
label = "is part of"
description = "belongs to or is a component, section or sub-unit of"

[predicates.is_a]
label = "is a"
description = "is a kind, type or instance of"

[predicates.member_of]
label = "is a member of"
description = "works for, is employed by or belongs to an organization or project"
domain = ["Person", "Role"]
range = ["Organization", "Project"]

[predicates.has_role]
label = "has the role"
description = "holds the title or position"
domain = ["Person"]
range = ["Role"]

[predicates.leads]
label = "leads"
description = "heads, manages, directs or is in charge of (led by / headed by with the subject and object swapped)"
domain = ["Person", "Role"]
range = ["Organization", "Project", "Product", "Process", "Event", "Policy", "Concept"]

[predicates.reports_to]
label = "reports to"
description = "is accountable to or supervised by"
domain = ["Person", "Role"]
range = ["Person", "Role"]
functional = true

[predicates.responsible_for]
label = "is responsible for"
description = "owns, maintains, administers or is accountable for"
domain = ["Person", "Role", "Organization"]

[predicates.approves]
label = "approves"
description = "authorizes, signs off or has approval authority over"
domain = ["Person", "Role", "Organization"]

[predicates.located_in]
label = "is located in"
description = "is based, headquartered or situated in"
range = ["Location"]

[predicates.depends_on]
label = "depends on"
description = "relies on, is built on or cannot work without"
domain = ["Product", "Project", "Process"]

[predicates.uses]
label = "uses"
description = "uses, utilizes, runs on or is built with"
range = ["Product", "Process", "Concept", "Document", "Project"]

[predicates.provides]
label = "provides"
description = "offers, supplies, delivers or produces"
domain = ["Organization", "Person", "Product", "Project", "Process"]
range = ["Product", "Process", "Concept", "Document", "Policy"]

[predicates.applies_to]
label = "applies to"
description = "governs, covers or is addressed to"
domain = ["Policy", "Process", "Concept", "Document"]
range = ["Person", "Role", "Organization", "Process", "Product", "Project", "Event"]

[predicates.requires]
label = "requires"
description = "needs, mandates or is conditional on"

[predicates.describes]
label = "describes"
description = "documents, defines, specifies or states"
domain = ["Document", "Policy", "Process", "Organization", "Product"]

[predicates.collaborates_with]
label = "collaborates with"
description = "partners with, works with or co-develops with"
domain = ["Person", "Organization"]
range = ["Person", "Organization", "Product"]
symmetric = true

[predicates.founded_by]
label = "was founded by"
description = "was founded, created or established by"
domain = ["Organization", "Product", "Project"]
range = ["Person", "Organization"]

[predicates.participates_in]
label = "participates in"
description = "takes part in, contributes to or attends"
domain = ["Person", "Role", "Organization"]
range = ["Event", "Process", "Project", "Product", "Concept"]

[predicates.precedes]
label = "precedes"
description = "happens before or leads into"
domain = ["Event", "Process"]
range = ["Event", "Process"]

# Fallback when nothing above fits; kept only between two named (standalone) entities.
[predicates.related_to]
label = "is related to"
description = "has a stated connection that none of the other relations express"
symmetric = true

# Worked examples shown to the extraction model (few-shot). They must use only the types and
# predicates above and quote their passage verbatim; loading fails otherwise. Remove them all to run
# zero-shot. They are prompt material, so they do not change the ontology version.
# Keep relation keys in this order: subject, predicate, object, phrase, quote.
[[examples]]
passage = "Anil is the engineering manager. Priya is a backend developer working under Anil. Priya maintains the Payment API. The Payment API depends on PostgreSQL."
relations = [
  { subject = "Anil", predicate = "has_role", object = "engineering manager", phrase = "is the", quote = "Anil is the engineering manager." },
  { subject = "Priya", predicate = "reports_to", object = "Anil", phrase = "working under", quote = "Priya is a backend developer working under Anil." },
  { subject = "Priya", predicate = "responsible_for", object = "Payment API", phrase = "maintains", quote = "Priya maintains the Payment API." },
  { subject = "Payment API", predicate = "depends_on", object = "PostgreSQL", phrase = "depends on", quote = "The Payment API depends on PostgreSQL." },
]
entities = [
  { name = "Anil", type = "Person" },
  { name = "engineering manager", type = "Role" },
  { name = "Priya", type = "Person" },
  { name = "Payment API", type = "Product" },
  { name = "PostgreSQL", type = "Product" },
]

[[examples]]
passage = "- **Billing** — Led by Sara Lin. Owns the invoice service and the refund process.\n- **Support** — Led by Omar Diaz. Sara Lin and Omar Diaz report to Mei Wong (COO)."
relations = [
  { subject = "Sara Lin", predicate = "leads", object = "Billing", phrase = "Led by", quote = "**Billing** — Led by Sara Lin." },
  { subject = "Billing", predicate = "responsible_for", object = "invoice service", phrase = "Owns", quote = "**Billing** — Led by Sara Lin. Owns the invoice service and the refund process." },
  { subject = "Billing", predicate = "responsible_for", object = "refund process", phrase = "Owns", quote = "**Billing** — Led by Sara Lin. Owns the invoice service and the refund process." },
  { subject = "Omar Diaz", predicate = "leads", object = "Support", phrase = "Led by", quote = "**Support** — Led by Omar Diaz." },
  { subject = "Sara Lin", predicate = "reports_to", object = "Mei Wong", phrase = "report to", quote = "Sara Lin and Omar Diaz report to Mei Wong (COO)." },
  { subject = "Omar Diaz", predicate = "reports_to", object = "Mei Wong", phrase = "report to", quote = "Sara Lin and Omar Diaz report to Mei Wong (COO)." },
  { subject = "Mei Wong", predicate = "has_role", object = "COO", phrase = "", quote = "Mei Wong (COO)" },
]
entities = [
  { name = "Billing", type = "Organization" },
  { name = "Sara Lin", type = "Person" },
  { name = "invoice service", type = "Product" },
  { name = "refund process", type = "Process" },
  { name = "Support", type = "Organization" },
  { name = "Omar Diaz", type = "Person" },
  { name = "Mei Wong", type = "Person" },
  { name = "COO", type = "Role" },
]
