# Example: a different domain with a different vocabulary (engineering teams and services).
# Use it with KE_ONTOLOGY_PATH=docs/ontology-examples/software.toml, then re-index.
# Entities of the same `class` with the same name are the same entity; `standalone` types are kept
# even when no relation mentions them; domain/range constrain which types a relation may connect.

[types.Person]
description = "an engineer, manager or other named person"
class = "person"
standalone = true

[types.Department]
description = "a team, department or other named group of people"
class = "organization"
standalone = true
aliases = ["team", "group", "org", "organization", "company"]

[types.SoftwareService]
description = "a service, API, application or internal system"
class = "software"
standalone = true
aliases = ["service", "api", "application", "system", "product"]

[types.Technology]
description = "a database, language, framework, protocol or platform"
class = "technology"
standalone = true
aliases = ["database", "language", "framework", "platform", "library", "tool"]

[types.Incident]
description = "a named outage, incident or postmortem"
class = "event"
standalone = false

[predicates.reports_to]
label = "reports to"
description = "is managed by or accountable to"
domain = ["Person"]
range = ["Person"]
functional = true

[predicates.member_of]
label = "is a member of"
description = "works in or belongs to a team"
domain = ["Person"]
range = ["Department"]

[predicates.maintains]
label = "maintains"
description = "owns, operates or is on call for"
domain = ["Person", "Department"]
range = ["SoftwareService"]

[predicates.depends_on]
label = "depends on"
description = "calls, reads from, is built on or cannot run without"
domain = ["SoftwareService"]
range = ["SoftwareService", "Technology"]

[predicates.caused_by]
label = "was caused by"
description = "was triggered or caused by"
domain = ["Incident"]
range = ["SoftwareService", "Technology"]

# Required fallback; only kept between two named (standalone) entities.
[predicates.related_to]
label = "is related to"
description = "has a stated connection that none of the other relations express"
symmetric = true

# Few-shot example for the extraction prompt, in this domain's vocabulary. An ontology without
# [[examples]] runs zero-shot; the default ontology's examples are never reused for another domain.
[[examples]]
passage = "Ravi is a member of the Platform team. Ravi maintains the Ledger API. The Ledger API depends on PostgreSQL. The March outage was caused by the Ledger API."
relations = [
  { subject = "Ravi", predicate = "member_of", object = "Platform", phrase = "is a member of", quote = "Ravi is a member of the Platform team." },
  { subject = "Ravi", predicate = "maintains", object = "Ledger API", phrase = "maintains", quote = "Ravi maintains the Ledger API." },
  { subject = "Ledger API", predicate = "depends_on", object = "PostgreSQL", phrase = "depends on", quote = "The Ledger API depends on PostgreSQL." },
  { subject = "March outage", predicate = "caused_by", object = "Ledger API", phrase = "was caused by", quote = "The March outage was caused by the Ledger API." },
]
entities = [
  { name = "Ravi", type = "Person" },
  { name = "Platform", type = "Department" },
  { name = "Ledger API", type = "SoftwareService" },
  { name = "PostgreSQL", type = "Technology" },
  { name = "March outage", type = "Incident" },
]
