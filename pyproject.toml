[project]
name = "knowledge-engine"
version = "0.1.0"
description = "Local knowledge engine: documents to entities, relations and grounded answers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "numpy>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
]
[project.optional-dependencies]
documents = ["docling>=2.50,<3"]
evaluation = ["lightrag-hku>=1.4,<2"]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pytest-cov>=6,<8"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests", "scripts/tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates and test fixtures read better unwrapped.
"backend/knowledge_engine/generation/prompt.py" = ["E501"]
"backend/knowledge_engine/extraction/extractor.py" = ["E501"]
"backend/tests/*" = ["E501"]
[tool.mypy]
python_version = "3.12"
files = ["backend/knowledge_engine"]
strict = true
[[tool.mypy.overrides]]
module = ["docling.*", "lightrag.*"]
ignore_missing_imports = true
