# Example messages for small-talk routing (generation/smalltalk.py).
#
# A message is embedded and compared with these, by meaning, not by words: it is small talk when
# its nearest small_talk example is closer than its nearest question example by
# KE_SMALL_TALK_MARGIN. Messages not listed here route by similarity to these.
#
# Keep both lists generic and multilingual, never about the documents (the engine is
# domain-neutral). `questions` deliberately includes greetings joined to a real question
# ("hi, who approves leave requests?") so those are answered from the documents.
# Each example moves the scores: after editing, run `make eval-routing` (held-out messages in
# fixtures/small-talk.json) and set KE_SMALL_TALK_MARGIN to the margin it suggests.

